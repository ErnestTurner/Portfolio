<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a101a" />
    <title>Page Not Found | Ernest's Playground</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; --bg: #0a101a; --panel: #111b2a; --line: #2a3b52; --text: #f4f7fb; --muted: #9aacbf; --mint: #a3ffd3; --lavender: #bcadff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 80% 10%, #1a2340 0, var(--bg) 36rem); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
      main { width: min(720px, 100%); padding: clamp(32px, 7vw, 72px); border: 1px solid var(--line); border-radius: 24px; background: #111b2add; box-shadow: 0 24px 80px #0008; }
      .kicker { color: var(--mint); font: 700 12px/1.4 "Courier New", monospace; letter-spacing: 3px; }
      h1 { margin: 18px 0; font-size: clamp(48px, 10vw, 92px); line-height: .95; letter-spacing: -4px; }
      h1 em { color: var(--lavender); font-family: Georgia, serif; font-weight: 400; }
      p { max-width: 520px; color: var(--muted); font-size: 18px; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      a { border: 1px solid var(--line); border-radius: 10px; padding: 13px 18px; color: var(--text); font-weight: 700; text-decoration: none; }
      a:first-child { border-color: var(--mint); background: var(--mint); color: #09263a; }
      a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">404 / LOST IN THE WORKSHOP</div>
      <h1>That idea got out<br /><em>without a forwarding address.</em></h1>
      <p>The page you asked for is not here. The games and experiments are still right where we left them.</p>
      <nav aria-label="Recovery links">
        <a href="/">Return home</a>
        <a href="/#arcade">Enter the arcade</a>
      </nav>
    </main>
  </body>
</html>
