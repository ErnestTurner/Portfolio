<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Experiment with Scribble Engine, Ernest Turner's kinetic drawing toy where two independently rotating arms trace changing geometric patterns.">

  <meta name="twitter:description" content="Adjust two independently rotating arms and watch them trace changing geometric patterns in Ernest Turner's browser experiment.">

  <style>
    :root {
      color-scheme: dark;
      --bench: #080e20;
      --panel: #101d2b;
      --panel-deep: #0b1525;
      --edge: #2a3c50;
      --ink: #eff5fa;
      --muted: #9aacbd;
      --mint: #b4f7a7;
      --pink: #ffafcc;
      --blue: #a2c8ff;
      --arm-one: var(--pink);
      --arm-two: var(--mint);
      --focus: #fff2a8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 13% 12%, #192744 0, transparent 29rem), radial-gradient(circle at 92% 84%, #17372f 0, transparent 32rem), var(--bench);
      color: var(--ink);
      font: 16px/1.45 Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(14px, 2.5vw, 30px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
      gap: clamp(18px, 3vw, 34px);
      align-items: center;
    }

    .drawing-wrap {
      min-width: 0;
      display: grid;
      place-items: center;
      position: relative;
      padding: clamp(7px, 1.4vw, 14px);
    }

    .apparatus-label { position: absolute; top: 24px; left: 26px; z-index: 2; color: #a2c8ffb8; font: 700 9px/1 "Courier New", monospace; letter-spacing: .16em; text-transform: uppercase; pointer-events: none; }
    .apparatus-label::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 9px var(--pink); vertical-align: 1px; }
    .drawing-wrap::before, .drawing-wrap::after { content: ""; position: absolute; width: 42px; height: 42px; pointer-events: none; z-index: 1; }
    .drawing-wrap::before { top: 0; left: 0; border-top: 2px solid var(--pink); border-left: 2px solid var(--pink); }
    .drawing-wrap::after { right: 0; bottom: 0; border-right: 2px solid var(--mint); border-bottom: 2px solid var(--mint); }

    canvas {
      display: block;
      width: min(100%, 720px);
      height: auto;
      aspect-ratio: 1;
      background: #0b1425;
      border: 1px solid #354a62;
      border-radius: 12px;
      box-shadow: 0 24px 75px #020611aa, 0 0 0 6px #ffffff05;
      touch-action: none;
    }

    .controls {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #122236f5, #0b1627f5);
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 25px 22px 22px;
      box-shadow: 0 20px 65px #02061188;
    }

    .controls::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--mint) 0 36%, var(--pink) 36% 69%, var(--blue) 69%); }
    .controls::after { content: "MEDDLING PERMITTED"; position: absolute; top: 17px; right: -35px; width: 142px; padding: 4px 0; transform: rotate(35deg); border-top: 1px solid #ffafcc66; border-bottom: 1px solid #ffafcc66; color: #ffafcc99; font: 700 8px/1 "Courier New", monospace; letter-spacing: .14em; text-align: center; pointer-events: none; }
    .arcade-back { display: inline-block; margin: 0 0 18px; color: var(--mint); font: 700 10px/1 "Courier New", monospace; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
    .arcade-back:focus-visible { outline: 3px solid var(--focus); outline-offset: 5px; }
    .eyebrow { margin: 0 0 8px; color: var(--mint); font: 700 11px/1.2 "Courier New", monospace; letter-spacing: .18em; text-transform: uppercase; }
    .designation { display: inline-block; margin: 0 0 17px; padding: 5px 8px; border: 1px solid #41546a; border-radius: 3px; color: #91a6b8; font: 700 9px/1 "Courier New", monospace; letter-spacing: .1em; text-transform: uppercase; transform: rotate(-1deg); }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(2rem, 4vw, 2.65rem);
      line-height: .95;
      letter-spacing: -.065em;
      text-transform: uppercase;
    }

    h1 em { color: var(--mint); font-style: normal; }

    .invitation {
      margin: 0 0 22px;
      max-width: 28ch;
      color: #c4d2df;
      font-size: .92rem;
      line-height: 1.55;
    }

    fieldset {
      position: relative;
      margin: 0 0 16px;
      padding: 15px;
      border: 1px solid var(--edge);
      border-radius: 9px;
      background: #ffffff03;
    }

    fieldset::after { content: ""; position: absolute; right: 9px; bottom: 9px; width: 4px; height: 4px; border: 1px solid #6e8296; border-radius: 50%; box-shadow: inset 0 0 0 1px #08101e; opacity: .7; }

    legend {
      padding: 0 7px;
      font-weight: 750;
      font-size: .77rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .arm-one legend { color: var(--arm-one); }
    .arm-two legend { color: var(--arm-two); }

    .control-row { margin-bottom: 14px; }
    .control-row:last-child { margin-bottom: 0; }

    label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: #dbe5ee;
      font-size: .92rem;
    }

    output {
      min-width: 4.8em;
      color: var(--blue);
      font-family: "Courier New", monospace;
      font-size: .85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      min-height: 30px;
      margin: 0;
      cursor: pointer;
    }

    .arm-one input[type="range"] { accent-color: var(--pink); }
    .arm-two input[type="range"] { accent-color: var(--mint); }

    button {
      min-height: 44px;
      border: 1px solid #40566d;
      border-radius: 7px;
      background: #14243a;
      color: #f5f8f7;
      padding: 9px 12px;
      font: inherit;
      font-weight: 680;
      cursor: pointer;
    }

    button:hover { border-color: var(--mint); background: #1a3045; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    button:active { transform: translateY(1px); }

    .direction {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }

    .direction span:first-child { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
    .direction span:last-child { color: var(--blue); font: 700 .79rem "Courier New", monospace; }
    .arm-one .direction { border-left: 3px solid var(--pink); }
    .arm-two .direction { border-left: 3px solid var(--mint); }

    .note {
      margin: -2px 2px 17px;
      color: var(--muted);
      font-size: .82rem;
    }

    .shared {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .shared button:first-child { border-color: #6e8ca1; background: #1a3045; }
    .shared button:last-child { color: var(--pink); }

    @media (max-width: 760px) {
      main {
        min-height: auto;
        grid-template-columns: 1fr;
        align-items: start;
      }
      canvas { width: min(100%, 590px); }
      .controls { width: min(100%, 590px); justify-self: center; }
      .apparatus-label { top: 19px; left: 21px; }
    }

    @media (max-width: 390px) {
      .shared { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="drawing-wrap" aria-label="Scribble Engine drawing area">
      <span class="apparatus-label" aria-hidden="true">Live consequence window</span>
      <canvas id="view" width="600" height="600"></canvas>
    </section>

    <section class="controls" aria-label="Scribble Engine controls">
      <a class="arcade-back" href="../../#arcade" target="_top">← Trikzik's Lab</a>
      <p class="eyebrow">Trikzik Labs · Experimental apparatus 02</p>
      <h1>Scribble <em>Engine</em></h1>
      <p class="invitation">Can you draw a straight line using two things that only rotate?</p>
      <p class="designation">Dual-orbit mark maker · Please interfere</p>

      <fieldset class="arm-one">
        <legend>Arm 1</legend>
        <div class="control-row">
          <label for="length1">Length <output id="length1Value" for="length1">100 units</output></label>
          <input id="length1" type="range" min="20" max="140" step="1" value="100">
        </div>
        <div class="control-row">
          <label for="speed1">Speed <output id="speed1Value" for="speed1">30°/s</output></label>
          <input id="speed1" type="range" min="0" max="360" step="1" value="30">
        </div>
        <button class="direction" id="direction1" type="button" aria-pressed="false">
          <span>Rotation direction</span><span>Clockwise ↻</span>
        </button>
      </fieldset>

      <fieldset class="arm-two">
        <legend>Arm 2</legend>
        <div class="control-row">
          <label for="length2">Length <output id="length2Value" for="length2">70 units</output></label>
          <input id="length2" type="range" min="20" max="140" step="1" value="70">
        </div>
        <div class="control-row">
          <label for="speed2">Speed <output id="speed2Value" for="speed2">90°/s</output></label>
          <input id="speed2" type="range" min="0" max="360" step="1" value="90">
        </div>
        <button class="direction" id="direction2" type="button" aria-pressed="true">
          <span>Rotation direction</span><span>Counterclockwise ↺</span>
        </button>
      </fieldset>

      <p class="note">Both arm angles are measured from the page, independently—not from each other.</p>

      <div class="shared">
        <button id="pause" type="button">Pause</button>
        <button id="clear" type="button">Clear Paper</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    // State: logical units live in a fixed 600 × 600 drawing space.
    const SIZE = 600;
    const CENTER = { x: SIZE / 2, y: SIZE / 2 };
    const DEFAULTS = Object.freeze({
      length1: 100, length2: 70,
      speed1: 30, speed2: 90,
      direction1: 1, direction2: -1,
      angle1: 0, angle2: 0
    });
    const state = { ...DEFAULTS, running: true };

    const view = document.querySelector('#view');
    const viewContext = view.getContext('2d', { alpha: false });
    const ink = document.createElement('canvas');
    ink.width = ink.height = SIZE;
    const inkContext = ink.getContext('2d');
    let previousPen = null;
    let previousTime = performance.now();

    // Kinematics: both angles are absolute page angles, exactly as shown here.
    function positions(source = state) {
      const elbowX = CENTER.x + source.length1 * Math.cos(source.angle1);
      const elbowY = CENTER.y + source.length1 * Math.sin(source.angle1);
      return {
        elbowX,
        elbowY,
        penX: elbowX + source.length2 * Math.cos(source.angle2),
        penY: elbowY + source.length2 * Math.sin(source.angle2)
      };
    }

    function breakStroke() {
      previousPen = null;
    }

    function clearInk() {
      inkContext.clearRect(0, 0, SIZE, SIZE);
      breakStroke();
    }

    // Drawing: ink accumulates in one bounded canvas; machinery is redrawn separately.
    function addInk(point) {
      if (previousPen) {
        inkContext.beginPath();
        inkContext.moveTo(previousPen.x, previousPen.y);
        inkContext.lineTo(point.penX, point.penY);
        inkContext.strokeStyle = '#eff5fa';
        inkContext.lineWidth = 1.15;
        inkContext.lineCap = 'round';
        inkContext.lineJoin = 'round';
        inkContext.stroke();
      }
      previousPen = { x: point.penX, y: point.penY };
    }

    function drawMechanism(point) {
      viewContext.fillStyle = '#0b1425';
      viewContext.fillRect(0, 0, SIZE, SIZE);

      // A faint drafting grid gives the workbench texture without becoming ink.
      viewContext.beginPath();
      for (let line = 30; line < SIZE; line += 30) {
        viewContext.moveTo(line, 0);
        viewContext.lineTo(line, SIZE);
        viewContext.moveTo(0, line);
        viewContext.lineTo(SIZE, line);
      }
      viewContext.strokeStyle = '#a2c8ff0a';
      viewContext.lineWidth = 1;
      viewContext.stroke();

      viewContext.drawImage(ink, 0, 0);

      viewContext.lineCap = 'round';
      viewContext.lineJoin = 'round';

      viewContext.beginPath();
      viewContext.moveTo(CENTER.x, CENTER.y);
      viewContext.lineTo(point.elbowX, point.elbowY);
      viewContext.strokeStyle = '#ffafcc';
      viewContext.lineWidth = 7;
      viewContext.stroke();

      viewContext.beginPath();
      viewContext.moveTo(point.elbowX, point.elbowY);
      viewContext.lineTo(point.penX, point.penY);
      viewContext.strokeStyle = '#b4f7a7';
      viewContext.lineWidth = 6;
      viewContext.stroke();

      joint(CENTER.x, CENTER.y, 8, '#ffd4e3');
      cyclopsBearing(point.elbowX, point.elbowY, point.penX, point.penY);
      penUfo(point.penX, point.penY);
    }

    function joint(x, y, radius, color) {
      viewContext.beginPath();
      viewContext.arc(x, y, radius, 0, Math.PI * 2);
      viewContext.fillStyle = color;
      viewContext.fill();
      viewContext.strokeStyle = '#0b1425';
      viewContext.lineWidth = 2;
      viewContext.stroke();
    }

    // The elbow is technically a bearing. It is also keeping an eye on the pen.
    function cyclopsBearing(x, y, targetX, targetY) {
      const direction = Math.atan2(targetY - y, targetX - x);
      viewContext.save();
      viewContext.translate(x, y);
      viewContext.beginPath();
      viewContext.arc(0, 0, 11, 0, Math.PI * 2);
      viewContext.fillStyle = '#ffafcc';
      viewContext.fill();
      viewContext.strokeStyle = '#0b1425';
      viewContext.lineWidth = 2.5;
      viewContext.stroke();
      viewContext.beginPath();
      viewContext.ellipse(0, 0, 6.2, 5, direction, 0, Math.PI * 2);
      viewContext.fillStyle = '#eff5fa';
      viewContext.fill();
      viewContext.beginPath();
      viewContext.arc(Math.cos(direction) * 2.2, Math.sin(direction) * 2.2, 2.2, 0, Math.PI * 2);
      viewContext.fillStyle = '#101d2b';
      viewContext.fill();
      viewContext.restore();
    }

    // A very small UFO performs the serious business of putting ink on paper.
    function penUfo(x, y) {
      viewContext.save();
      viewContext.translate(x, y);
      viewContext.beginPath();
      viewContext.moveTo(-8, -2);
      viewContext.quadraticCurveTo(0, -11, 8, -2);
      viewContext.closePath();
      viewContext.fillStyle = '#a2c8ff';
      viewContext.fill();
      viewContext.strokeStyle = '#0b1425';
      viewContext.lineWidth = 2;
      viewContext.stroke();
      viewContext.beginPath();
      viewContext.ellipse(0, 0, 12, 4.8, 0, 0, Math.PI * 2);
      viewContext.fillStyle = '#b4f7a7';
      viewContext.fill();
      viewContext.strokeStyle = '#0b1425';
      viewContext.stroke();
      viewContext.beginPath();
      viewContext.arc(-4, 0, 1.2, 0, Math.PI * 2);
      viewContext.arc(4, 0, 1.2, 0, Math.PI * 2);
      viewContext.fillStyle = '#ffafcc';
      viewContext.fill();
      // The bright center remains exactly on the mathematical pen coordinate.
      viewContext.beginPath();
      viewContext.arc(0, 0, 2.4, 0, Math.PI * 2);
      viewContext.fillStyle = '#eff5fa';
      viewContext.shadowColor = '#eff5fa';
      viewContext.shadowBlur = 8;
      viewContext.fill();
      viewContext.restore();
    }

    // Motion: subdivide elapsed time so fast settings still leave a smooth trail.
    function advance(elapsedSeconds) {
      const radians1 = state.direction1 * state.speed1 * Math.PI / 180;
      const radians2 = state.direction2 * state.speed2 * Math.PI / 180;
      const fastest = Math.max(Math.abs(radians1), Math.abs(radians2));
      const sampleDuration = fastest > 0 ? Math.min(1 / 120, (Math.PI / 180) / fastest) : 1 / 120;
      const steps = Math.max(1, Math.ceil(elapsedSeconds / sampleDuration));
      const step = elapsedSeconds / steps;

      for (let index = 0; index < steps; index += 1) {
        state.angle1 = (state.angle1 + radians1 * step) % (Math.PI * 2);
        state.angle2 = (state.angle2 + radians2 * step) % (Math.PI * 2);
        addInk(positions());
      }
    }

    function frame(now) {
      const elapsed = Math.min((now - previousTime) / 1000, 0.05);
      previousTime = now;
      if (state.running) advance(elapsed);
      drawMechanism(positions());
      requestAnimationFrame(frame);
    }

    // Controls: settings update immediately without changing either angle.
    const controls = {
      length1: document.querySelector('#length1'),
      length2: document.querySelector('#length2'),
      speed1: document.querySelector('#speed1'),
      speed2: document.querySelector('#speed2'),
      direction1: document.querySelector('#direction1'),
      direction2: document.querySelector('#direction2'),
      pause: document.querySelector('#pause')
    };

    function syncControls() {
      for (const key of ['length1', 'length2', 'speed1', 'speed2']) {
        controls[key].value = state[key];
        const suffix = key.startsWith('length') ? ' units' : '°/s';
        document.querySelector(`#${key}Value`).value = `${state[key]}${suffix}`;
      }
      for (const key of ['direction1', 'direction2']) {
        const counterclockwise = state[key] < 0;
        controls[key].setAttribute('aria-pressed', String(counterclockwise));
        controls[key].lastElementChild.textContent = counterclockwise ? 'Counterclockwise ↺' : 'Clockwise ↻';
      }
      controls.pause.textContent = state.running ? 'Pause' : 'Resume';
    }

    for (const key of ['length1', 'length2']) {
      controls[key].addEventListener('input', event => {
        state[key] = Number(event.target.value);
        breakStroke();
        syncControls();
      });
    }

    for (const key of ['speed1', 'speed2']) {
      controls[key].addEventListener('input', event => {
        state[key] = Number(event.target.value);
        syncControls();
      });
    }

    for (const key of ['direction1', 'direction2']) {
      controls[key].addEventListener('click', () => {
        state[key] *= -1;
        syncControls();
      });
    }

    controls.pause.addEventListener('click', () => {
      state.running = !state.running;
      breakStroke();
      previousTime = performance.now();
      syncControls();
    });

    document.querySelector('#clear').addEventListener('click', clearInk);

    document.querySelector('#reset').addEventListener('click', () => {
      Object.assign(state, DEFAULTS, { running: true });
      clearInk();
      previousTime = performance.now();
      syncControls();
    });

    document.addEventListener('visibilitychange', () => {
      previousTime = performance.now();
      breakStroke();
    });

    syncControls();
    drawMechanism(positions());
    requestAnimationFrame(frame);
  </script>
</body>
</html>
